[package]
name = "rust-singularity-core-v3"
version = "3.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-complex = "0.4"
flate2 = "1.1"
sha2 = "0.10"
tauri = { version = "2.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[workspace]
resolver = "2"

[lib]
name = "rust_singularity_core_v3"
path = "src/lib.rs"

[[bin]]
name = "rust-singularity-core-v3"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
